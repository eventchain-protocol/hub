[package]
name = "hub"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
build = "build.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bytes = "1"
sha2 = "0.10"

[build-dependencies]
glob = "0.3"
